# ADAMftd Partner Kit — Netlify deploy config
# Static site + Functions for /api/admin/* and /api/data

[build]
  publish = "."
  functions = "netlify/functions"
  # No build command — static files are served as-is. Functions are auto-bundled.

[functions]
  node_bundler = "esbuild"

# ---------- API routing ----------
# Public read (generator hits this on load)
[[redirects]]
  from = "/api/data"
  to = "/.netlify/functions/public-data"
  status = 200

# Admin auth
[[redirects]]
  from = "/api/admin/login"
  to = "/.netlify/functions/admin-login"
  status = 200

# Admin CRUD
[[redirects]]
  from = "/api/admin/affiliates"
  to = "/.netlify/functions/admin-affiliates"
  status = 200

[[redirects]]
  from = "/api/admin/cobranded"
  to = "/.netlify/functions/admin-cobranded"
  status = 200

# ---------- Admin page (pretty URL) ----------
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200

# ---------- Cache headers ----------
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=600"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, immutable"

# Block search indexing of the admin route
[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
