# ADAMftd Partner Kit — Netlify deploy config
# Static site + v2 Functions (which self-declare their /api/* paths).

[build]
  publish = "."
  functions = "netlify/functions"
  # No build command — static files served as-is. Functions are auto-bundled.

# Bundle the data/ seed files alongside each Function so blob.js can
# read them on first boot when the Blobs store is empty.
[functions]
  included_files = ["data/**"]
  # Native-binding libraries — keep as externals so Netlify's bundler
  # doesn't try to inline their binaries.
  external_node_modules = [
    "sharp",
    "@netlify/blobs",
    "puppeteer-core",
    "@sparticuz/chromium",
  ]

# Render-cover function uses headless Chromium → slower cold start.
[functions."render-cover"]
  timeout = 26

# Demo Pocket Script PDF render also uses headless Chromium.
[functions."render-demo-pdf"]
  timeout = 26

# ---------- Admin page (pretty URL) ----------
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200

# ---------- Render route (used by Puppeteer for cover screenshots) ----------
[[redirects]]
  from = "/render"
  to = "/render.html"
  status = 200

# ---------- Cache headers ----------
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=600"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, immutable"

# Block search indexing of the admin route
[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
