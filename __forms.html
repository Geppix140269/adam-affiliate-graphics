<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow" />
  <title>ADAMftd Partner Kit form registry</title>
</head>
<body>
  <!--
    Static form definition so Netlify's build-time form detector registers
    the "sub-affiliate-referral" form. This page is not linked from anywhere
    and is not used by a browser. The /api/sub-affiliate function posts new
    referrals to this form server-side so a submission email can be sent.
  -->
  <form name="sub-affiliate-referral" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="sub-affiliate-referral" />
    <input name="bot-field" />
    <input type="text" name="ma_code" />
    <input type="text" name="ma_name" />
    <input type="text" name="referral_id" />
    <input type="text" name="submitted_at" />
    <input type="text" name="sub_name" />
    <input type="email" name="sub_email" />
    <input type="text" name="sub_company" />
    <input type="text" name="sub_country" />
    <input type="text" name="sub_phone" />
    <input type="url" name="sub_website" />
    <input type="text" name="sub_role" />
    <input type="text" name="sub_target" />
    <textarea name="sub_pitch"></textarea>
    <input type="text" name="sub_relationship" />
    <textarea name="notes"></textarea>
  </form>
</body>
</html>
